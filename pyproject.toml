[project]
name = "taal_inventory"
authors = [
    {name = "TAAL+ Healthcare", email = "admin@taalplus.in"}
]
description = "Pharmacy Inventory Management for TAAL+ Healthcare"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    "frappe>=15.0.0 <16.0.0"
]

[build-system]
requires = ["flit_core >=3.2.0,<4"]
build-backend = "flit_core.buildapi"

[tool.flit.module]
name = "taal_inventory"